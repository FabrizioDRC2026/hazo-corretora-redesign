<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hazo · Apresentação Figma</title>
    <style>
      body { margin: 0; background: #101820; color: white; font-family: Inter, Arial, sans-serif; }
      header { padding: 28px 36px; position: sticky; top: 0; background: rgba(16,24,32,.92); backdrop-filter: blur(14px); z-index: 2; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { margin: 0; color: rgba(255,255,255,.7); }
      main { display: grid; gap: 28px; padding: 28px; }
      figure { margin: 0 auto; width: min(1120px, 100%); }
      img { width: 100%; display: block; border-radius: 10px; box-shadow: 0 24px 90px rgba(0,0,0,.35); background: white; }
      figcaption { padding: 10px 4px 0; color: rgba(255,255,255,.65); font-weight: 700; }
    </style>
  </head>
  <body>
    <header><h1>Hazo · Modelo de apresentação para Figma</h1><p>Importe os SVGs da pasta slides no Figma como frames 16:9.</p></header>
    <main>
      <figure><img src="slides/01-capa.svg" alt="Slide 1"><figcaption>01 · Proposta de Redesign Digital</figcaption></figure>
<figure><img src="slides/02-objetivo.svg" alt="Slide 2"><figcaption>02 · Transformar o site em uma experiência comercial clara.</figcaption></figure>
<figure><img src="slides/03-diagnostico.svg" alt="Slide 3"><figcaption>03 · O conteúdo já existe. A oportunidade está na hierarquia.</figcaption></figure>
<figure><img src="slides/04-arquitetura.svg" alt="Slide 4"><figcaption>04 · Um site completo, com páginas pensadas por intenção.</figcaption></figure>
<figure><img src="slides/05-identidade.svg" alt="Slide 5"><figcaption>05 · A identidade Hazo ganha uma leitura mais premium e limpa.</figcaption></figure>
<figure><img src="slides/06-paginas.svg" alt="Slide 6"><figcaption>06 · Cada página trabalha uma decisão do cliente.</figcaption></figure>
<figure><img src="slides/07-conversao.svg" alt="Slide 7"><figcaption>07 · O WhatsApp vira o fluxo central de atendimento.</figcaption></figure>
<figure><img src="slides/08-proximos-passos.svg" alt="Slide 8"><figcaption>08 · Com a direção aprovada, o projeto entra em refinamento e publicação.</figcaption></figure>
    </main>
  </body>
</html>
